name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sakuramedia_javbus_metadata
          persist-credentials: false

      - name: Checkout SakuraMedia host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tinypinglite/sakuramediabe
          ref: c81af12d8ca76fa1d66b34baf1aaf6be15387aff
          path: host
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync host environment
        working-directory: host
        run: uv sync --all-groups --no-install-project

      - name: Lint
        working-directory: sakuramedia_javbus_metadata
        run: ../host/.venv/bin/ruff check .

      - name: Test without network or business database
        env:
          SAKURAMEDIA_HOST_ROOT: ${{ github.workspace }}/host
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/host
        run: >
          host/.venv/bin/python -m pytest
          "${{ github.workspace }}/sakuramedia_javbus_metadata/tests"
          --confcutdir="${{ github.workspace }}/sakuramedia_javbus_metadata/tests"
          -o addopts= -q
